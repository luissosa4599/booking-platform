name: CI

on:
  push:
    branches: [main]
  # No branch filter — the filter matches the PR's *base*, so restricting to
  # `main` skips CI on stacked PRs (one feature branch targeting another). Run
  # on every PR regardless of target.
  pull_request:

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # No explicit project/solution argument — dotnet auto-discovers
      # BookingEngine.Api.slnx, which covers all 5 projects (Domain,
      # Infrastructure, Api, Api.Tests, Worker). The worker has no dedicated
      # CI job of its own for exactly this reason; it's already built and
      # test-discovered here.
      - name: dotnet restore
        run: dotnet restore

      - name: dotnet build
        run: dotnet build --no-restore --configuration Release

      - name: dotnet test
        run: dotnet test --no-build --configuration Release

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Build-only validation (no push, no registry) — catches a broken
      # Dockerfile or a missing file in the build context before it's
      # discovered at actual deploy time. See docker-compose.yml for how
      # these two images are meant to be run together locally.
      - name: Build api image
        run: docker build -f api/BookingEngine.Api/Dockerfile -t booking-api:ci ./api

      - name: Build worker image
        run: docker build -f api/BookingEngine.Worker/Dockerfile -t booking-worker:ci ./api

  app:
    name: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test --if-present -- --watchAll=false

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: bookingengine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d bookingengine"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The API — Development so /dev/seed exists, migrations self-apply on
      # start, and the rate limiter is lifted for the suite's request volume.
      ConnectionStrings__Default: "Host=localhost;Port=5432;Database=bookingengine;Username=booking;Password=booking"
      ASPNETCORE_ENVIRONMENT: Development
      AUTH_TOKEN_SECRET: ci-e2e-secret-not-for-real-use
      RUN_MIGRATIONS_ON_STARTUP: "true"
      RATE_LIMIT_PER_MINUTE: "100000"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build API
        working-directory: api
        run: dotnet build BookingEngine.Api/BookingEngine.Api.csproj -c Release

      - name: Start API
        working-directory: api
        run: |
          nohup dotnet run --no-build -c Release \
            --project BookingEngine.Api/BookingEngine.Api.csproj > api.log 2>&1 &

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: Install Playwright chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Start web
        working-directory: app
        env:
          EXPO_PUBLIC_API_URL: http://localhost:5190
        run: nohup npx expo start --web --port 8081 > expo.log 2>&1 &

      - name: e2e
        working-directory: app
        run: npx playwright test

      - name: API log
        if: always()
        run: cat api/api.log || true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
